# Pilot binding for the Lavon, TX MPC. The single source of truth that
# wires Wave-1 agents to the deal: schemas, sources, calendars, advisors.
#
# Operator fills in the TODO blocks with real values; nothing else in the
# repo should hard-code Lavon-specific values.

deal:
  slug: lavon-pilot
  name: "Lavon Pilot MPC"
  jurisdiction: "City of Lavon"
  county: "Collin"
  state: "TX"
  status: horizontal       # prospect|under_contract|entitling|horizontal|vertical|built_out|sold
  stage_notes: "Active construction; new stacked instruments being stood up."

# Stacked instruments being stood up.
instruments:
  - kind: pid
    name: "Lavon Pilot PID"
    status: drafting
    eligibility_schema: templates/eligibility_schemas/lavon/pid.yml
    bond_orders:
      - series: "Series 2026A"
        status: drafting
  - kind: mud
    name: "Lavon MUD No. TBD"
    status: drafting
    eligibility_schema: templates/eligibility_schemas/lavon/mud.yml
    bond_orders:
      - series: "Series 2026A"
        status: drafting
  - kind: tirz
    name: "Lavon TIRZ No. TBD"
    status: proposed
    eligibility_schema: templates/eligibility_schemas/lavon/tirz.yml
  - kind: 380
    name: "Lavon 380 Agreement"
    status: proposed
    eligibility_schema: templates/eligibility_schemas/lavon/380.yml
  - kind: 381
    name: "Collin County 381 Agreement"
    status: proposed
    eligibility_schema: templates/eligibility_schemas/lavon/381.yml

